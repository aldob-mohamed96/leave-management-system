name: Deploy to Namecheap

# Disabled by default — deploy by pulling on the server instead:
#   ssh ... then: bash ~/leave.rtltec.com/scripts/server-deploy.sh
# Repo: https://github.com/dobmohamed2020/leave-management-system
#
# To re-enable auto-deploy later, remove the `if: false` line and set SSH secrets.

on:
  workflow_dispatch:

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Pull & build on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            bash "$HOME/leave.rtltec.com/scripts/server-deploy.sh"
